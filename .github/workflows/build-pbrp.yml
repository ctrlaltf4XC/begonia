name: Build PBRP for begonia

# Builds PitchBlack Recovery for the Redmi Note 8 Pro (begonia) inside a
# GitHub-hosted runner, then uploads the recovery.img and the flashable zip.
#
# The build uses the PBRP android-12.1 manifest (TWRP 3.7.1_12 / PBRP 4.0),
# which is the newest actively-maintained PBRP branch and provides the FBE
# v2 + hardware-wrapped-key + lptools support required for Android 16 ROMs.

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "PBRP manifest branch"
        required: true
        default: "android-12.1"
        type: choice
        options:
          - android-12.1
          - android-14.0
      make_target:
        description: "Make target"
        required: true
        default: "recoveryimage"
        type: choice
        options:
          - recoveryimage
          - pbrp
          - bootimage
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

concurrency:
  group: pbrp-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_URL: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  DEVICE_TREE: pbrp_device_tree
  DEVICE_PATH: device/xiaomi/begonia
  LUNCH_TARGET: pb_begonia-eng
  TZ: Europe/London

jobs:
  build:
    name: PBRP ${{ github.event.inputs.manifest_branch || 'android-12.1' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Free up disk space
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/share/swift /usr/lib/jvm || true
          sudo apt-get clean
          echo "After:"
          df -h /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless
          df -h

      - name: Configure git and repo
        run: |
          git config --global user.name "PBRP CI"
          git config --global user.email "ci@begonia.local"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.manifest_branch || 'android-12.1' }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.manifest_branch || 'android-12.1' }}-

      - name: Initialise and sync PBRP manifest
        env:
          MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'android-12.1' }}
        run: |
          mkdir -p android && cd android
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth 1 \
                    --git-lfs --no-clone-bundle
          # Drop the largest non-essential projects, then sync.
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags \
                    --optimized-fetch || repo sync -c -j"$(nproc)" --force-sync
          echo "Sync complete."

      - name: Place device tree
        run: |
          cd android
          rm -rf "$DEVICE_PATH"
          mkdir -p "$(dirname "$DEVICE_PATH")"
          cp -a "../device-tree/$DEVICE_TREE" "$DEVICE_PATH"
          ls -la "$DEVICE_PATH"

      - name: Apply begonia patches
        run: |
          cd android
          bash "$DEVICE_PATH/patches/apply-patches.sh" || \
            echo "No patches to apply (or already applied)."

      - name: Set up build environment
        run: |
          cd android
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          echo "Lunch target set: $LUNCH_TARGET"

      - name: Build recovery
        env:
          MAKE_TARGET: ${{ github.event.inputs.make_target || 'recoveryimage' }}
        run: |
          cd android
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          set -o pipefail
          make -j"$(nproc)" "$MAKE_TARGET" 2>&1 | tee /tmp/build.log

      - name: Collect artefacts
        if: always()
        run: |
          mkdir -p out
          cd android
          find out/target/product/begonia -maxdepth 1 \
               \( -name "recovery.img" -o -name "*.zip" -o -name "boot.img" \
                  -o -name "dtbo.img" -o -name "vbmeta.img" \) \
               -exec cp -v {} ../out/ \; || true
          cd ..
          ls -la out/ || true
          # Also grab the compiled fstab for verification
          cp -v android/out/target/product/begonia/recovery/root/system/etc/recovery.fstab \
                out/ 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbrp-begonia-${{ github.run_number }}
          path: out/*
          if-no-files-found: warn