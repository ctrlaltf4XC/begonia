name: Build PBRP for begonia

on:
  push:
    branches: [ main, dynamic ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Recovery fstab variant to build'
        type: choice
        options:
          - safe
          - static
          - dynamic
        default: safe
      beanpod_crypto:
        description: 'Relink beanpod keymaster stack into recovery (wrapped-key FBE)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      ALLOW_MISSING_DEPENDENCIES: true
      LC_ALL: C
      # workflow_dispatch inputs are empty for push events, so fall back to
      # "safe": that variant is an exact copy of the known-working begonia
      # tree's fstab and is the baseline for bisecting the splash hang.
      # Previously the workflow referenced $INPUT_VARIANT, which was never
      # declared as an input and therefore always resolved to "static".
      PBRP_VARIANT: ${{ inputs.variant || 'safe' }}
      BEANPOD_CRYPTO: ${{ inputs.beanpod_crypto && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless
          df -h

      - name: Configure git and repo
        run: |
          git config --global user.name "PBRP CI"
          git config --global user.email "ci@begonia.local"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Initialize PBRP
        run: |
          echo "Starting repo init..."
          repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b android-12.1
          echo "Repo init completed."
          mkdir -p .repo/local_manifests
          cp pbrp_device_tree/pb_begonia.mk .repo/local_manifests/
          echo "Starting repo sync..."
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          echo "Repo sync completed."

      - name: Copy device tree
        run: |
          rm -rf device/xiaomi/begonia
          mkdir -p device/xiaomi
          cp -rp pbrp_device_tree device/xiaomi/begonia
          # Remove libshim_beanpod from the copied tree to avoid duplicate definition
          # since we want to use the one from pbrp_device_tree/libshim_beanpod
          rm -rf device/xiaomi/begonia/libshim_beanpod

      - name: Select fstab variant
        id: fstab
        run: |
          # PBRP_VARIANT comes from the workflow_dispatch `variant` input
          # (job-level env, defaults to "static" on push builds).
          VARIANT="${PBRP_VARIANT:-static}"
          FSTAB="pbrp_device_tree/variants/recovery.fstab.$VARIANT"
          if [ ! -f "$FSTAB" ]; then
            echo "::error::unknown variant '$VARIANT' (no $FSTAB)"
            echo "available variants:"
            ls -1 pbrp_device_tree/variants/
            exit 1
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "Selected fstab variant: $VARIANT"
          ls -la "$FSTAB"

      - name: Setup fstab
        run: |
          VARIANT="${{ steps.fstab.outputs.variant }}"
          mkdir -p device/xiaomi/begonia/recovery/root/system/etc
          cp pbrp_device_tree/variants/recovery.fstab.$VARIANT device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab
          echo "--- installed recovery.fstab ---"
          grep -vE '^\s*#|^\s*$' device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab

      - name: Fetch decryption blobs
        run: |
          bash pbrp_device_tree/fetch-decryption-blobs.sh

      - name: Apply patches
        run: |
          bash pbrp_device_tree/patches/apply-patches.sh

      - name: Setup build
        run: |
          source build/envsetup.sh
          lunch pb_begonia-eng

      - name: Build recovery image
        run: |
          source build/envsetup.sh
          lunch pb_begonia-eng
          mka recoveryimage

      - name: Create flashable zip
        if: success()
        run: |
          set -euo pipefail
          OUT_DIR=out/target/product/begonia
          RECOVERY_IMG=$OUT_DIR/recovery.img
          # ${VARIANT} was previously unset here (it only existed in the fstab
          # steps), so the artifact came out as "PBRP-begonia-.zip".
          VARIANT="${PBRP_VARIANT:-static}"
          if [ -f "$RECOVERY_IMG" ]; then
            mkdir -p flashable_zip/META-INF/com/google/android
            cp "$RECOVERY_IMG" flashable_zip/
            # Create minimal updater-script
            echo 'ui_print("Installing PBRP recovery...");' > flashable_zip/META-INF/com/google/android/updater-script
            echo 'package_extract_file("recovery.img", "/dev/block/bootdevice/by-name/recovery");' >> flashable_zip/META-INF/com/google/android/updater-script
            echo 'ui_print("Done!");' >> flashable_zip/META-INF/com/google/android/updater-script
            # Create dummy update-binary
            echo '#!/system/bin/sh' > flashable_zip/META-INF/com/google/android/update-binary
            chmod +x flashable_zip/META-INF/com/google/android/update-binary
            (cd flashable_zip && zip -r "../PBRP-begonia-${VARIANT}.zip" .)
            mv "PBRP-begonia-${VARIANT}.zip" "$OUT_DIR/"
            echo "Flashable zip created: $OUT_DIR/PBRP-begonia-${VARIANT}.zip"
          else
            echo "ERROR: recovery.img not found in $OUT_DIR"
            exit 1
          fi

      - name: Write build info
        if: success()
        run: |
          {
            echo "PBRP begonia build"
            echo "commit:    $GITHUB_SHA"
            echo "branch:    $GITHUB_REF_NAME"
            echo "variant:   ${PBRP_VARIANT:-static}"
            echo "beanpod:   ${BEANPOD_CRYPTO:-false}"
            echo "date:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- recovery.fstab baked into the image ---"
            grep -vE '^\s*#|^\s*$' device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab
          } > out/target/product/begonia/BUILD_INFO.txt
          cat out/target/product/begonia/BUILD_INFO.txt

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          # Variant in the artifact name so a static and a dynamic build no
          # longer overwrite/confuse each other.
          name: PBRP-begonia-${{ steps.fstab.outputs.variant }}-${{ env.BEANPOD_CRYPTO == 'true' && 'beanpod' || 'nobeanpod' }}
          path: |
            out/target/product/begonia/recovery.img
            out/target/product/begonia/PBRP-begonia-*.zip
            out/target/product/begonia/BUILD_INFO.txt
            out/target/product/begonia/obj/EXECUTABLES/recovery_intermediates/recovery
            out/target/product/begonia/obj/SHARED_LIBRARIES/libshim_beanpod_intermediates/libshim_beanpod.so
          if-no-files-found: warn
          retention-days: 30