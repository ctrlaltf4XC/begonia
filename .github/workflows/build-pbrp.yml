name: Build PBRP for begonia

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ALLOW_MISSING_DEPENDENCIES: true
      LC_ALL: C
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 libxml-simple-perl
          sudo apt-get install -y bc bsdmainutils csstools device-tree-compiler gdisk libssl-dev lzop pngcrush rsync schedtool squashfs-tools
          sudo apt-get install -y libxml2-utils maven ncftp htop imagemagick liblz4-tool android-tools-adb android-tools-fastboot

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Initialize PBRP
        run: |
          repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pbrp.git -b android-12.1
          mkdir -p .repo/local_manifests
          cp pbrp_device_tree/pb_begonia.mk .repo/local_manifests/
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          rm -rf device/xiaomi/begonia
          mkdir -p device/xiaomi
          cp -rp pbrp_device_tree device/xiaomi/begonia

      - name: Select fstab variant
        id: fstab
        run: |
          # Default to static; can be overridden via workflow_dispatch input
          VARIANT="${INPUT_VARIANT:-static}"
          echo "variant=$VARIANT" >> $GITHUB_OUTPUT
          echo "Selected fstab variant: $VARIANT"
          ls -la pbrp_device_tree/variants/recovery.fstab.$VARIANT

      - name: Setup fstab
        run: |
          VARIANT="${{ steps.fstab.outputs.variant }}"
          mkdir -p device/xiaomi/begonia/recovery/root/system/etc
          cp pbrp_device_tree/variants/recovery.fstab.$VARIANT device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab

      - name: Fetch decryption blobs
        run: |
          bash pbrp_device_tree/fetch-decryption-blobs.sh

      - name: Apply patches
        run: |
          bash pbrp_device_tree/patches/apply-patches.sh

      - name: Setup build
        run: |
          source build/envsetup.sh
          lunch pb_begonia-eng

      - name: Build recovery image
        run: |
          mka recoveryimage

      - name: Create flashable zip
        if: success()
        run: |
          OUT_DIR=out/target/product/begonia
          RECOVERY_IMG=$OUT_DIR/recovery.img
          if [ -f "$RECOVERY_IMG" ]; then
            mkdir -p flashable_zip/META-INF/com/google/android
            cp $RECOVERY_IMG flashable_zip/
            # Create minimal updater-script
            echo 'ui_print("Installing PBRP recovery...");' > flashable_zip/META-INF/com/google/android/updater-script
            echo 'package_extract_file("recovery.img", "/dev/block/bootdevice/by-name/recovery");' >> flashable_zip/META-INF/com/google/android/updater-script
            echo 'ui_print("Done!");' >> flashable_zip/META-INF/com/google/android/updater-script
            # Create dummy update-binary
            echo '#!/system/bin/sh' > flashable_zip/META-INF/com/google/android/update-binary
            chmod +x flashable_zip/META-INF/com/google/android/update-binary
            cd flashable_zip && zip -r ../PBRP-begonia-${VARIANT}.zip . && cd ..
            mv PBRP-begonia-${VARIANT}.zip $OUT_DIR/
            echo "Flashable zip created: $OUT_DIR/PBRP-begonia-${VARIANT}.zip"
          else
            echo "ERROR: recovery.img not found in $OUT_DIR"
            exit 1
          fi

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-begonia-artifacts
          path: |
            out/target/product/begonia/recovery.img
            out/target/product/begonia/PBRP-begonia-*.zip
            out/target-product/begonia/obj/EXECUTABLES/recovery_intermediates/
            out/target-product/begonia/obj/SHARED_LIBRARIES/libshim_beanpod_intermediates/
          retention-days: 30