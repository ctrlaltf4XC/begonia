name: Build PBRP for begonia

on:
  push:
    branches: [ main, dynamic ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Recovery fstab variant to build'
        type: choice
        options:
          - safe
          - static
          - dynamic
        default: safe
      crypto:
        description: 'Enable the vendor MicroTrust FBE/keymaster stack'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      ALLOW_MISSING_DEPENDENCIES: true
      LC_ALL: C
      # Push events have no workflow_dispatch inputs. The default is the
      # no-crypto safe image so a broken vendor TEE cannot strand PBRP at splash.
      PBRP_VARIANT: ${{ inputs.variant || 'safe' }}
      PBRP_ENABLE_CRYPTO: ${{ inputs.crypto && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 lib32ncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless
          df -h

      - name: Configure git and repo
        run: |
          git config --global user.name "PBRP CI"
          git config --global user.email "ci@begonia.local"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Initialize PBRP
        run: |
          echo "Starting repo init..."
          repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b android-12.1
          echo "Repo init completed."
          mkdir -p .repo/local_manifests
          cp pbrp_device_tree/pb_begonia.mk .repo/local_manifests/
          echo "Starting repo sync..."
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          echo "Repo sync completed."

      - name: Copy device tree
        run: |
          rm -rf device/xiaomi/begonia
          mkdir -p device/xiaomi
          cp -rp pbrp_device_tree device/xiaomi/begonia
          test -f device/xiaomi/begonia/libshim_beanpod/Android.mk

      - name: Select fstab variant
        id: fstab
        run: |
          set -euo pipefail
          VARIANT="${PBRP_VARIANT:-safe}"
          CRYPTO="${PBRP_ENABLE_CRYPTO:-false}"
          if [ "$CRYPTO" != true ] && [ "$VARIANT" != safe ]; then
            echo "::error::no-crypto builds support only the safe variant"
            exit 1
          fi
          if [ "$CRYPTO" = true ] && [ "$VARIANT" = safe ]; then
            echo "::error::crypto builds require the static or dynamic variant"
            exit 1
          fi
          FSTAB="pbrp_device_tree/variants/recovery.fstab.$VARIANT"
          test -f "$FSTAB"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "crypto=$CRYPTO" >> "$GITHUB_OUTPUT"
          echo "Selected fstab variant: $VARIANT (crypto=$CRYPTO)"

      - name: Setup fstab
        run: |
          set -euo pipefail
          VARIANT="${{ steps.fstab.outputs.variant }}"
          mkdir -p device/xiaomi/begonia/recovery/root/system/etc
          cp "pbrp_device_tree/variants/recovery.fstab.$VARIANT" \
             device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab
          echo "--- installed recovery.fstab ---"
          grep -vE '^\s*#|^\s*$' device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab

      - name: Fetch decryption blobs
        run: |
          if [ "${PBRP_ENABLE_CRYPTO:-false}" = true ]; then
            bash pbrp_device_tree/fetch-decryption-blobs.sh
          else
            echo "Skipping proprietary TEE blobs for no-crypto safe build"
          fi

      - name: Apply patches
        run: ANDROID_BUILD_TOP="$GITHUB_WORKSPACE" bash pbrp_device_tree/patches/apply-patches.sh

      - name: Drop device tree source copy
        run: |
          # device/xiaomi/begonia is the copy that kati/Soong should scan.
          # Leaving pbrp_device_tree in place registers every module twice, e.g.
          # "MODULE.TARGET.SHARED_LIBRARIES.libshim_beanpod already defined by
          # device/xiaomi/begonia/libshim_beanpod". Safe to drop here: the last
          # step that referenced it was Apply patches.
          rm -rf pbrp_device_tree
          test -f device/xiaomi/begonia/libshim_beanpod/Android.mk

      - name: Setup build
        run: |
          source build/envsetup.sh
          lunch pb_begonia-eng

      - name: Build recovery image
        run: |
          source build/envsetup.sh
          lunch pb_begonia-eng
          mka recoveryimage

      - name: Create flashable zip
        if: success()
        run: |
          set -euo pipefail
          OUT_DIR=out/target/product/begonia
          RECOVERY_IMG="$OUT_DIR/recovery.img"
          VARIANT="${PBRP_VARIANT:-safe}"
          CRYPTO_LABEL=nocrypto
          if [ "${PBRP_ENABLE_CRYPTO:-false}" = true ]; then
            CRYPTO_LABEL=crypto
          fi
          test -f "$RECOVERY_IMG"
          mkdir -p flashable_zip/META-INF/com/google/android
          cp "$RECOVERY_IMG" flashable_zip/
          echo 'ui_print("Installing PBRP recovery...");' > flashable_zip/META-INF/com/google/android/updater-script
          echo 'package_extract_file("recovery.img", "/dev/block/bootdevice/by-name/recovery");' >> flashable_zip/META-INF/com/google/android/updater-script
          echo 'ui_print("Done!");' >> flashable_zip/META-INF/com/google/android/updater-script
          printf '#!/system/bin/sh\n' > flashable_zip/META-INF/com/google/android/update-binary
          chmod +x flashable_zip/META-INF/com/google/android/update-binary
          ZIP_NAME="PBRP-begonia-${VARIANT}-${CRYPTO_LABEL}.zip"
          (cd flashable_zip && zip -r "../$ZIP_NAME" .)
          mv "$ZIP_NAME" "$OUT_DIR/"
          echo "Flashable zip created: $OUT_DIR/$ZIP_NAME"

      - name: Write build info
        if: success()
        run: |
          set -euo pipefail
          {
            echo "PBRP begonia build"
            echo "commit:    $GITHUB_SHA"
            echo "branch:    $GITHUB_REF_NAME"
            echo "variant:   ${PBRP_VARIANT:-safe}"
            echo "crypto:    ${PBRP_ENABLE_CRYPTO:-false}"
            echo "date:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- recovery.fstab baked into the image ---"
            grep -vE '^\s*#|^\s*$' device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab
          } > out/target/product/begonia/BUILD_INFO.txt
          cat out/target/product/begonia/BUILD_INFO.txt

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-begonia-${{ steps.fstab.outputs.variant }}-${{ env.PBRP_ENABLE_CRYPTO == 'true' && 'crypto' || 'nocrypto' }}
          path: |
            out/target/product/begonia/recovery.img
            out/target/product/begonia/PBRP-begonia-*.zip
            out/target/product/begonia/BUILD_INFO.txt
            out/target/product/begonia/obj/EXECUTABLES/recovery_intermediates/recovery
            out/target/product/begonia/obj/SHARED_LIBRARIES/libshim_beanpod_intermediates/libshim_beanpod.so
          if-no-files-found: warn
          retention-days: 30
